<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تسجيل الدخول - SocialNet</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body class="login-page">

    <div class="gate">
        <div class="login-card">

            <div class="logo-box">SN</div>

            <h1>SocialNet</h1>

            <p>أدخل اسمك وكلمة مرور الموقع للدخول</p>

            <form id="loginForm">

                <input
                    id="userName"
                    type="text"
                    maxlength="30"
                    autocomplete="name"
                    placeholder="اسمك"
                    required
                >

                <input
                    id="sitePassword"
                    type="password"
                    autocomplete="current-password"
                    placeholder="كلمة المرور"
                    required
                >

                <button id="loginButton" type="submit">
                    دخول
                </button>

            </form>

            <div id="loginError" class="error"></div>

        </div>
    </div>

    <!-- JavaScript خارجي، وليس inline -->
    <script src="/login.js"></script>

</body>
</html>
