<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>تسجيل الدخول - SocialNet</title>

    <link
        rel="stylesheet"
        href="/style.css"
    >

</head>

<body class="login-page">

<div class="gate">

    <div class="login-card">

        <div class="logo-box">
            SN
        </div>

        <h1>
            SocialNet
        </h1>

        <p>
            أدخل اسمك وكلمة مرور الموقع للدخول
        </p>


        <form id="loginForm">

            <input
                id="userName"
                type="text"
                maxlength="30"
                autocomplete="name"
                placeholder="اسمك"
                required
            >


            <input
                id="sitePassword"
                type="password"
                autocomplete="current-password"
                placeholder="كلمة المرور"
                required
            >


            <button
                id="loginButton"
                type="submit"
            >
                دخول
            </button>

        </form>


        <div
            id="loginError"
            class="error"
        ></div>

    </div>

</div>


<script>

const form =
    document.getElementById(
        "loginForm"
    );

const nameInput =
    document.getElementById(
        "userName"
    );

const passwordInput =
    document.getElementById(
        "sitePassword"
    );

const button =
    document.getElementById(
        "loginButton"
    );

const error =
    document.getElementById(
        "loginError"
    );


/* =========================
   التحقق من جلسة هذا التبويب
========================= */

async function checkExistingTabSession() {

    const token =
        sessionStorage.getItem(
            "sn_token"
        );

    if (!token) {
        return;
    }

    try {

        const response =
            await fetch(
                "/api/me",
                {
                    headers: {
                        Authorization:
                            "Bearer " + token
                    }
                }
            );

        if (response.ok) {

            location.replace(
                "/index.html"
            );

        } else {

            sessionStorage.removeItem(
                "sn_token"
            );

            sessionStorage.removeItem(
                "sn_user"
            );
        }

    } catch (err) {

        console.error(err);
    }
}


/* =========================
   تسجيل الدخول
========================= */

form.addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        error.textContent = "";

        const name =
            nameInput.value.trim();

        const password =
            passwordInput.value;

        if (!name || !password) {

            error.textContent =
                "أدخل الاسم وكلمة المرور.";

            return;
        }

        button.disabled = true;

        button.textContent =
            "جاري الدخول...";

        try {

            const response =
                await fetch(
                    "/api/enter",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            name,
                            password
                        })
                    }
                );

            const data =
                await response
                    .json()
                    .catch(() => ({}));

            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "فشل تسجيل الدخول."
                );
            }

            /*
              مهم جدًا:
              Token خاص بهذا التبويب.
            */

            if (!data.token) {

                throw new Error(
                    "الخادم لم يعطِ Token للجلسة."
                );
            }

            sessionStorage.setItem(
                "sn_token",
                data.token
            );

            sessionStorage.setItem(
                "sn_user",
                JSON.stringify(
                    data.user
                )
            );

            /*
              الدخول مباشرة إلى الموقع.
            */

            location.replace(
                "/index.html"
            );

        } catch (err) {

            error.textContent =
                err.message;

        } finally {

            button.disabled = false;

            button.textContent =
                "دخول";
        }
    }
);


checkExistingTabSession();

</script>

</body>
</html>
