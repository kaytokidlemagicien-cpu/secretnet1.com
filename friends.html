<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>المستخدمون - SocialNet</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >

</head>

<body>

<header>

  <div class="welcome">

    <button
      id="logout"
      class="small"
    >
      خروج
    </button>

    <span>
      👋
      <strong id="username">...</strong>
    </span>

  </div>

  <div class="brand">
    SocialNet
  </div>

</header>


<nav>

  <button
    onclick="location.href='/index.html'"
  >
    🏠 الرئيسية
  </button>

  <button
    onclick="location.href='/profile.html'"
  >
    👤 ملفي
  </button>

  <button class="active">
    👥 المستخدمون
  </button>

  <button
    onclick="location.href='/messages.html'"
  >
    💬 الرسائل
  </button>

</nav>


<main>

  <div class="panel">

    <h2>
      👥 المستخدمون
    </h2>

    <div id="usersList">
      جاري التحميل...
    </div>

  </div>

</main>


<script>

function token() {

  return sessionStorage.getItem(
    "sn_token"
  );

}


async function init() {

  const t = token();


  if (!t) {

    location.replace(
      "/login.html"
    );

    return;

  }


  const meResponse =
    await fetch(
      "/api/me",
      {
        headers: {
          "Authorization":
            "Bearer " + t
        }
      }
    );


  if (!meResponse.ok) {

    sessionStorage.clear();

    location.replace(
      "/login.html"
    );

    return;

  }


  const me =
    await meResponse.json();


  document.getElementById(
    "username"
  ).textContent =
    me.user.name;


  const response =
    await fetch(
      "/api/users",
      {
        headers: {
          "Authorization":
            "Bearer " + t
        }
      }
    );


  if (!response.ok) {

    return;

  }


  const data =
    await response.json();


  const list =
    document.getElementById(
      "usersList"
    );


  if (!data.users.length) {

    list.innerHTML =
      "<p>لا يوجد مستخدمون آخرون.</p>";

    return;

  }


  list.innerHTML =
    data.users.map(user => `

      <div class="userRow">

        <span>
          👤 ${escapeHtml(user.name)}
        </span>

        <button
          onclick="
            location.href =
            '/messages.html?user=${user.id}'
          "
        >
          مراسلة
        </button>

      </div>

    `).join("");

}


function escapeHtml(value) {

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    c => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    }[c])
  );

}


document.getElementById(
  "logout"
).onclick = async function() {

  const t = token();


  if (t) {

    await fetch(
      "/api/logout",
      {
        method: "POST",

        headers: {
          "Authorization":
            "Bearer " + t
        }
      }
    );

  }


  sessionStorage.clear();

  location.replace(
    "/login.html"
  );

};


init();

</script>

</body>
</html>
