<!doctype html><html lang="fr" dir="ltr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mon profil - SocialNet</title><link rel="stylesheet" href="/style.css"></head><body>
<header class="topbar"><a class="brand" href="/index.html"><span class="brand-icon">SN</span><span>SocialNet</span></a><div class="header-actions"><div class="current-user"><span id="topName">...</span><span id="topAvatar" class="mini-avatar">👤</span></div><button id="logoutButton" class="logout-button">Déconnexion</button></div></header>
<main class="page"><div class="grid"><aside class="side"><div class="side-card"><div class="profile-mini"><div class="profile-mini-row"><span id="sideAvatar" class="avatar">👤</span><div><strong id="sideName">...</strong><small>Votre compte SocialNet</small></div></div></div><nav class="nav"><a href="/index.html">🏠 Accueil</a><a class="active" href="/profile.html">👤 Mon profil</a><a href="/friends.html">🤝 Amis</a><a href="/messages.html">💬 Messages</a></nav></div></aside>
<section><div class="card profile-hero"><div class="cover"></div><div class="profile-main"><div id="profileAvatar" class="avatar avatar-large">👤</div><h1 id="profileName">...</h1><p>Votre profil et vos publications sur SocialNet.</p><input id="avatarInput" type="file" accept="image/jpeg,image/png,image/gif,image/webp" hidden><button id="changeAvatar" class="btn btn-primary">📷 Changer la photo de profil</button><div id="avatarStatus" class="upload-status"></div><div class="profile-info"><div class="info-box"><span>ID utilisateur</span><strong id="profileId">...</strong></div><div class="info-box"><span>Date d’inscription</span><strong id="profileDate">...</strong></div></div></div></div><div class="page-head"><h2>Toutes mes publications</h2><button id="refreshProfile" class="btn btn-soft">↻ Actualiser</button></div><div id="profilePosts"></div></section>
<aside class="side right-side"><div class="card right-widget"><h3 class="widget-title">✨ SocialNet</h3><p class="muted">Votre photo, votre nom et toutes vos publications au même endroit.</p></div></aside></div></main>
<script src="/app.js"></script><script src="/common.js"></script><script src="/profile.js"></script></body></html>
