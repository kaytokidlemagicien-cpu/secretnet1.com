<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ملفي - SocialNet</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >

</head>

<body>

<header>

  <div class="welcome">

    <button
      id="logout"
      class="small"
    >
      خروج
    </button>

    <span>
      👋
      <strong id="username">...</strong>
    </span>

  </div>

  <div class="brand">
    SocialNet
  </div>

</header>


<nav>

  <button
    onclick="location.href='/index.html'"
  >
    🏠 الرئيسية
  </button>

  <button
    onclick="location.href='/index.html#profile'"
  >
    👤 ملفي
  </button>

  <button
    onclick="location.href='/index.html#friends'"
  >
    👥 المستخدمون
  </button>

  <button
    onclick="location.href='/index.html#messages'"
  >
    💬 الرسائل
  </button>

</nav>


<main>

  <div class="panel profile">

    <div class="avatar">
      👤
    </div>

    <h2 id="profileName">
      ...
    </h2>

    <p>
      هذا ملفك الشخصي في SocialNet.
    </p>

  </div>

</main>


<script>

async function init() {

  const token =
    sessionStorage.getItem(
      "sn_token"
    );


  if (!token) {

    location.replace(
      "/login.html"
    );

    return;

  }


  const response =
    await fetch(
      "/api/me",
      {
        headers: {
          "Authorization":
            "Bearer " + token
        }
      }
    );


  if (!response.ok) {

    sessionStorage.clear();

    location.replace(
      "/login.html"
    );

    return;

  }


  const data =
    await response.json();


  document.getElementById(
    "username"
  ).textContent =
    data.user.name;


  document.getElementById(
    "profileName"
  ).textContent =
    data.user.name;

}


document.getElementById(
  "logout"
).onclick = async function() {

  const token =
    sessionStorage.getItem(
      "sn_token"
    );


  if (token) {

    await fetch(
      "/api/logout",
      {
        method: "POST",

        headers: {
          "Authorization":
            "Bearer " + token
        }
      }
    );

  }


  sessionStorage.clear();

  location.replace(
    "/login.html"
  );

};


init();

</script>

</body>
</html>
