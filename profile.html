<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ملفي - SocialNet</title>

    <link
        rel="stylesheet"
        href="/style.css"
    >

</head>

<body>

<header class="topbar">

    <div class="brand">
        <span class="brand-icon">SN</span>
        SocialNet
    </div>

    <div class="header-user">

        <span id="usernameDisplay">
            ...
        </span>

        <button
            id="logoutButton"
            class="logout-button"
        >
            خروج
        </button>

    </div>

</header>


<main class="container">

    <nav class="nav-bar">

        <a
            href="/index.html"
            class="nav-item"
        >
            🏠 الرئيسية
        </a>

        <a
            href="/profile.html"
            class="nav-item active"
        >
            👤 ملفي
        </a>

        <a
            href="/friends.html"
            class="nav-item"
        >
            👥 الأصدقاء
        </a>

        <a
            href="/messages.html"
            class="nav-item"
        >
            💬 الرسائل
        </a>

    </nav>


    <section class="profile-card card">

        <div class="profile-avatar">
            👤
        </div>

        <h1 id="profileName">
            ...
        </h1>

        <p>
            مرحبًا بك في ملفك الشخصي على SocialNet.
        </p>

        <div class="profile-info">

            <div>
                <span>رقم المستخدم</span>
                <strong id="profileId">...</strong>
            </div>

            <div>
                <span>تاريخ التسجيل</span>
                <strong id="profileDate">...</strong>
            </div>

        </div>

    </section>

</main>


<script src="/app.js"></script>

<script>

if (!SocialNet.requireLogin()) {
    throw new Error("غير مسجل");
}

const usernameDisplay =
    document.getElementById(
        "usernameDisplay"
    );

const profileName =
    document.getElementById(
        "profileName"
    );

const profileId =
    document.getElementById(
        "profileId"
    );

const profileDate =
    document.getElementById(
        "profileDate"
    );

document
    .getElementById("logoutButton")
    .addEventListener(
        "click",
        () => SocialNet.logout()
    );


(async function() {

    try {

        const data =
            await SocialNet.me();

        const user =
            data.user;

        usernameDisplay.textContent =
            "👋 " + user.name;

        profileName.textContent =
            user.name;

        profileId.textContent =
            user.id;

        profileDate.textContent =
            SocialNet.formatDate(
                user.created_at
            );

    } catch (error) {

        console.error(error);

    }

})();

</script>

</body>
</html>
