<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>الرئيسية - SocialNet</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >

</head>


<body data-page="home">

<header class="top-header">

  <div class="header-user">

    <span>
      👋 مرحبًا،
    </span>

    <strong data-user-name>
      ...
    </strong>

    <button
      id="logoutButton"
      class="logout-button"
    >
      خروج
    </button>

  </div>

  <div class="logo">
    SocialNet
  </div>

</header>


<main class="main-container">


  <nav class="nav-bar">

    <a
      href="index.html"
      class="nav-item"
    >
      🏠 الرئيسية
    </a>

    <a
      href="profile.html"
      class="nav-item"
    >
      👤 ملفي
    </a>

    <a
      href="friends.html"
      class="nav-item"
    >
      👥 الأصدقاء
    </a>

    <a
      href="messages.html"
      class="nav-item"
    >
      💬 الرسائل
    </a>

  </nav>


  <section class="card create-post">

    <h2>
      إنشاء منشور
    </h2>

    <textarea
      id="postBody"
      maxlength="5000"
      placeholder="بماذا تفكر؟"
    ></textarea>

    <input
      id="postImage"
      type="url"
      placeholder="رابط صورة (اختياري)"
    >

    <button
      id="publishButton"
      class="btn-primary"
    >
      نشر
    </button>

  </section>


  <section id="postsFeed">

    <div class="card empty">
      جاري تحميل المنشورات...
    </div>

  </section>


</main>


<script src="/app.js"></script>

</body>
</html>
