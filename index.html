<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>الرئيسية - SocialNet</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >

</head>

<body>

<header>

  <div class="welcome">

    <button
      id="logoutButton"
      class="small"
    >
      خروج
    </button>

    <span>
      👋 مرحبًا،
      <strong id="usernameDisplay">...</strong>
    </span>

  </div>

  <div class="brand">
    SocialNet
  </div>

</header>


<nav>

  <button
    data-view="homeView"
    class="active"
  >
    🏠 الرئيسية
  </button>

  <button
    data-view="profileView"
  >
    👤 ملفي
  </button>

  <button
    data-view="friendsView"
  >
    👥 المستخدمون
  </button>

  <button
    data-view="messagesView"
  >
    💬 الرسائل
  </button>

</nav>


<main>

  <!-- الرئيسية -->

  <section id="homeView" class="view">

    <div class="composer">

      <textarea
        id="postBody"
        maxlength="5000"
        placeholder="بماذا تفكر؟"
      ></textarea>

      <input
        id="postImage"
        type="text"
        maxlength="2000"
        placeholder="رابط صورة (اختياري)"
      >

      <button id="publishButton">
        نشر
      </button>

    </div>

    <div id="postsFeed"></div>

  </section>


  <!-- الملف الشخصي -->

  <section
    id="profileView"
    class="view hidden"
  >

    <div class="panel profile">

      <div class="avatar">
        👤
      </div>

      <h2 id="profileName">
        ...
      </h2>

      <p>
        مرحبًا بك في ملفك الشخصي.
      </p>

      <button
        id="deleteMyPosts"
        class="small"
      >
        حذف جميع منشوراتي
      </button>

    </div>

  </section>


  <!-- المستخدمون -->

  <section
    id="friendsView"
    class="view hidden"
  >

    <div class="panel">

      <h2>
        👥 المستخدمون
      </h2>

      <div
        id="friendsList"
        style="margin-top:15px"
      ></div>

    </div>

  </section>


  <!-- الرسائل -->

  <section
    id="messagesView"
    class="view hidden"
  >

    <div class="panel">

      <h2>
        💬 الرسائل
      </h2>

      <p>
        اختر مستخدمًا لبدء المحادثة.
      </p>

      <div
        id="messageUsers"
        style="margin-top:15px"
      ></div>

      <div
        id="chat"
        class="chat hidden"
      ></div>

    </div>

  </section>

</main>


<script src="/app.js"></script>

</body>
</html>
