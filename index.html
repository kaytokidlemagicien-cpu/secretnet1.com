<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SocialNet</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- شاشة تسجيل الدخول -->
  <div id="gate" class="gate">
    <div class="card">
      <div class="logo">SN</div>
      <h1>SocialNet</h1>
      <p>موقع تواصل خاص بالأصدقاء</p>
      <form id="passForm">
        <input id="sitePassword" type="password" placeholder="كلمة المرور" required>
        <input id="userName" maxlength="30" placeholder="اسمك" required>
        <button type="submit">دخول</button>
        <div id="passError" class="error"></div>
      </form>
    </div>
  </div>

  <!-- الواجهة الرئيسية للتطبيق -->
  <div id="app" class="hidden">
    <header>
      <div class="user-info">
        <button id="logout" class="btn-logout">خروج</button>
        <span>👋 مرحبًا، <strong id="currentName">...</strong></span>
      </div>
      <div class="logo">SocialNet</div>
    </header>

    <div class="main-container">
      <nav class="nav-bar">
        <button data-view="home" class="nav-item active">🏠 الرئيسية</button>
        <button data-view="friends" class="nav-item">👥 الأصدقاء</button>
        <button data-view="messages" class="nav-item">💬 الرسائل</button>
        <button data-view="profile" class="nav-item">👤 ملفي</button>
      </nav>

      <main>
        <!-- قسم الرئيسية والنشر -->
        <section id="home" class="view">
          <div class="card composer">
            <textarea id="postText" maxlength="500" placeholder="بماذا تفكر؟"></textarea>
            <input id="postImage" type="url" placeholder="رابط صورة (اختياري)" style="width:100%; padding:10px; margin-bottom:12px; border:1px solid #e5e7eb; border-radius:10px;">
            <button id="publish" class="btn-primary">نشر</button>
          </div>
          <div id="feed"></div>
        </section>

        <!-- قسم الأصدقاء -->
        <section id="friends" class="view hidden">
          <div class="card">
            <h2>👥 الأصدقاء الموجودون</h2>
            <div id="friendsList"></div>
          </div>
        </section>

        <!-- قسم الرسائل -->
        <section id="messages" class="view hidden">
          <div class="card">
            <h2>💬 الرسائل</h2>
            <div id="messageUsers"></div>
            <div id="chat" class="chat hidden"></div>
          </div>
        </section>

        <!-- قسم الملف الشخصي -->
        <section id="profile" class="view hidden">
          <div class="card profile">
            <div class="avatar" style="font-size: 40px; margin-bottom: 10px;">👤</div>
            <h2 id="profileName"></h2>
            <p>ملفك الشخصي داخل SocialNet.</p>
            <button id="clearMine" class="btn-primary" style="background:#ef4444; margin-top:15px;">حذف منشوراتي</button>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
