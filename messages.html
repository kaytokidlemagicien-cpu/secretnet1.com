<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>الرسائل - SocialNet</title>

    <link
        rel="stylesheet"
        href="/style.css"
    >

</head>

<body>

<header class="topbar">

    <div class="brand">
        <span class="brand-icon">SN</span>
        SocialNet
    </div>

    <div class="header-user">

        <span id="usernameDisplay">
            ...
        </span>

        <button
            id="logoutButton"
            class="logout-button"
        >
            خروج
        </button>

    </div>

</header>


<main class="container">

    <nav class="nav-bar">

        <a
            href="/index.html"
            class="nav-item"
        >
            🏠 الرئيسية
        </a>

        <a
            href="/profile.html"
            class="nav-item"
        >
            👤 ملفي
        </a>

        <a
            href="/friends.html"
            class="nav-item"
        >
            👥 الأصدقاء
        </a>

        <a
            href="/messages.html"
            class="nav-item active"
        >
            💬 الرسائل
        </a>

    </nav>


    <section class="messages-layout">

        <aside class="card conversations">

            <h2>
                المستخدمون
            </h2>

            <div id="usersList">
                جاري التحميل...
            </div>

        </aside>


        <section class="card chat-panel">

            <div
                id="chatHeader"
                class="chat-header"
            >
                اختر مستخدمًا لبدء المحادثة
            </div>


            <div
                id="messagesList"
                class="messages-list"
            >
                <div class="empty">
                    💬 اختر شخصًا من القائمة.
                </div>
            </div>


            <form
                id="messageForm"
                class="message-form hidden"
            >

                <input
                    id="messageInput"
                    maxlength="2000"
                    placeholder="اكتب رسالة..."
                    autocomplete="off"
                    required
                >

                <button
                    type="submit"
                    class="primary-button"
                >
                    إرسال
                </button>

            </form>

        </section>

    </section>

</main>


<script src="/app.js"></script>

<script>

if (!SocialNet.requireLogin()) {
    throw new Error("غير مسجل");
}


const usernameDisplay =
    document.getElementById(
        "usernameDisplay"
    );

const usersList =
    document.getElementById(
        "usersList"
    );

const chatHeader =
    document.getElementById(
        "chatHeader"
    );

const messagesList =
    document.getElementById(
        "messagesList"
    );

const messageForm =
    document.getElementById(
        "messageForm"
    );

const messageInput =
    document.getElementById(
        "messageInput"
    );


let selectedUser = null;


document
    .getElementById("logoutButton")
    .addEventListener(
        "click",
        () => SocialNet.logout()
    );


/* =========================
   المستخدمون
========================= */

async function loadUsers() {

    try {

        const me =
            await SocialNet.me();

        usernameDisplay.textContent =
            "👋 " + me.user.name;

        const data =
            await SocialNet.api(
                "/api/users"
            );

        if (!data.users.length) {

            usersList.innerHTML =
                `<p class="muted">
                    لا يوجد مستخدمون آخرون.
                </p>`;

            return;
        }

        usersList.innerHTML =
            data.users
                .map(user => `
                    <button
                        class="conversation-user"
                        onclick="openChat(
                            ${user.id},
                            '${SocialNet.escapeAttribute(
                                user.name
                            )}'
                        )"
                    >

                        <span class="avatar-small">
                            👤
                        </span>

                        <span>
                            ${SocialNet.escape(
                                user.name
                            )}
                        </span>

                    </button>
                `)
                .join("");

        /* فتح المستخدم الموجود في الرابط */

        const params =
            new URLSearchParams(
                location.search
            );

        const userId =
            Number(
                params.get("user")
            );

        if (
            Number.isInteger(userId) &&
            userId > 0
        ) {

            const selected =
                data.users.find(
                    user =>
                        Number(user.id) === userId
                );

            if (selected) {

                openChat(
                    selected.id,
                    selected.name
                );
            }
        }

    } catch (error) {

        usersList.innerHTML =
            `<div class="error-box">
                ${SocialNet.escape(
                    error.message
                )}
            </div>`;
    }
}


/* =========================
   فتح محادثة
========================= */

window.openChat =
    async function(userId, userName) {

        selectedUser = {
            id: Number(userId),
            name: userName
        };

        chatHeader.innerHTML =
            `
            <strong>
                💬 محادثة مع
                ${SocialNet.escape(
                    userName
                )}
            </strong>
            `;

        messagesList.innerHTML =
            `
            <div class="loading">
                جاري تحميل الرسائل...
            </div>
            `;

        messageForm.classList.remove(
            "hidden"
        );

        try {

            const data =
                await SocialNet.api(
                    `/api/messages/${userId}`
                );

            if (!data.messages.length) {

                messagesList.innerHTML =
                    `
                    <div class="empty">
                        لا توجد رسائل بعد.
                        ابدأ المحادثة الآن.
                    </div>
                    `;

                return;
            }

            messagesList.innerHTML =
                data.messages
                    .map(message => {

                        const mine =
                            Number(
                                message.sender_id
                            ) ===
                            Number(
                                SocialNet.user()?.id
                            );

                        return `
                            <div
                                class="
                                    message-bubble
                                    ${mine ? "mine" : "other"}
                                "
                            >

                                <strong>
                                    ${SocialNet.escape(
                                        message.sender
                                    )}
                                </strong>

                                <div>
                                    ${SocialNet.escape(
                                        message.body
                                    ).replace(
                                        /\n/g,
                                        "<br>"
                                    )}
                                </div>

                                <small>
                                    ${SocialNet.formatDate(
                                        message.created_at
                                    )}
                                </small>

                            </div>
                        `;

                    })
                    .join("");

            messagesList.scrollTop =
                messagesList.scrollHeight;

        } catch (error) {

            messagesList.innerHTML =
                `
                <div class="error-box">
                    ${SocialNet.escape(
                        error.message
                    )}
                </div>
                `;
        }
    };


/* =========================
   إرسال رسالة
========================= */

messageForm.addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        if (!selectedUser) return;

        const body =
            messageInput.value.trim();

        if (!body) return;

        const sendButton =
            messageForm.querySelector(
                "button"
            );

        sendButton.disabled = true;

        try {

            await SocialNet.api(
                `/api/messages/${selectedUser.id}`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        body
                    })
                }
            );

            messageInput.value = "";

            await openChat(
                selectedUser.id,
                selectedUser.name
            );

        } catch (error) {

            alert(
                error.message
            );

        } finally {

            sendButton.disabled = false;
        }
    }
);


loadUsers();

</script>

</body>
</html>
