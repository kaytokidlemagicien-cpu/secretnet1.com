<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>الرسائل - SocialNet</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >

</head>


<body data-page="messages">


<header class="top-header">

  <div class="header-user">

    <span>
      👋 مرحبًا،
    </span>

    <strong data-user-name>
      ...
    </strong>

    <button
      id="logoutButton"
      class="logout-button"
    >
      خروج
    </button>

  </div>

  <div class="logo">
    SocialNet
  </div>

</header>


<main class="main-container">


  <nav class="nav-bar">

    <a
      href="index.html"
      class="nav-item"
    >
      🏠 الرئيسية
    </a>

    <a
      href="profile.html"
      class="nav-item"
    >
      👤 ملفي
    </a>

    <a
      href="friends.html"
      class="nav-item"
    >
      👥 الأصدقاء
    </a>

    <a
      href="messages.html"
      class="nav-item"
    >
      💬 الرسائل
    </a>

  </nav>


  <section class="messages-layout">


    <div class="card users-panel">

      <h2>
        👥 المستخدمون
      </h2>

      <div id="messageUsers">

        <div class="empty">
          جاري التحميل...
        </div>

      </div>

    </div>


    <div class="card conversation-panel">


      <div
        id="conversationTitle"
        class="conversation-title"
      >
        💬 اختر شخصًا للمراسلة
      </div>


      <div
        id="messagesContainer"
        class="messages-container"
      >

        <div class="empty">
          اختر مستخدمًا من القائمة لبدء المحادثة.
        </div>

      </div>


      <div class="message-input-area">

        <input
          id="messageInput"
          type="text"
          maxlength="1000"
          placeholder="اكتب رسالة..."
        >

        <button
          id="sendMessageButton"
          onclick="sendMessage()"
          class="btn-primary"
        >
          إرسال
        </button>

      </div>


    </div>


  </section>


</main>


<script src="/app.js"></script>

</body>
</html>
